services:
  db:
    image: postgres:15-alpine
    container_name: printly_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-printly}
    ports:
      - "5433:5432"
    volumes:
      - printly_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-printly}"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: 
      context: ./backend
    container_name: printly_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-printly}
      - ENVIRONMENT=development
      - ALLOW_SUBDOMAIN_HEADER=true
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_for_mvp}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
    container_name: printly_frontend
    ports:
      - "4050:4050"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0 --port 4050
    restart: unless-stopped

volumes:
  printly_db_data:
